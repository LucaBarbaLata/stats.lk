# Production stack: docker compose up -d --build
x-app: &app
  env_file: .env
  environment:
    DATABASE_URL: postgres://statslk:${POSTGRES_PASSWORD}@db:5432/statslk
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: statslk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: statslk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statslk -d statslk"]
      interval: 5s
      retries: 10

  migrate:
    <<: *app
    build: { context: ., target: worker }
    command: ["./node_modules/.bin/tsx", "scripts/migrate.ts"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  worker:
    <<: *app
    build: { context: ., target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *app
    build: { context: ., target: web }
    ports:
      # Only open to this machine: the server's web server handles HTTPS and
      # forwards here (see Production in the README)
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # A dump a day in ./backups, kept for two weeks
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    command: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
